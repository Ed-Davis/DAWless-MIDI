name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # build number comes from the commit count
        persist-credentials: false

    - name: Show Swift version
      run: swift --version

    - name: Build
      run: |
        set -o pipefail
        swift build -c release 2>&1 | tee build.log

    - name: Run tests
      run: |
        set -o pipefail
        swift test --parallel 2>&1 | tee test.log

    - name: Report test failures
      if: failure()
      run: |
        touch build.log test.log
        msg=$( { grep -hE "error:|failed|XCTAssert|Fatal|crash" build.log test.log | sort -u | head -40; echo "----- tail -----"; grep -hv "warning:" build.log test.log | tail -25; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Tests failed::${msg}"

    - name: Build test DMG
      run: ./make-dmg.sh

    - name: Upload test DMG
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: DAWless-MIDI-test-dmg
        path: 'build/*.dmg'
        if-no-files-found: error
        retention-days: 14
