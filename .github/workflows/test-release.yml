name: Test Release

# Push to a branch named test-release/<anything> (or run it from the Actions
# tab) to publish a downloadable test build as a GitHub pre-release. The
# release is tagged v<version>-build<number>. The DMG name and the bottom of the window both show the
# version and build number, so it's easy to tell which build is installed.
on:
  push:
    branches: [ 'test-release/**' ]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write   # only the publish step is given the token
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # build number comes from the commit count
        persist-credentials: false

    - name: Run tests
      run: swift test --parallel

    - name: Build test DMG
      run: ./make-dmg.sh

    - name: Publish pre-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="$(tr -d '[:space:]' < Packaging/VERSION)"
        BUILD="$(git rev-list --count HEAD)"
        TAG="v${VERSION}-build${BUILD}"
        cat > notes.md <<NOTES
        Test build of DAWless MIDI ${VERSION} (build ${BUILD}), from commit ${GITHUB_SHA::7}.

        The bottom of the window shows "${VERSION} (${BUILD})" when this build is running.

        Not notarized: the first time, right-click DAWless MIDI in Applications and choose Open.
        NOTES
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" build/*.dmg --prerelease --target "$GITHUB_SHA" --title "DAWless MIDI ${VERSION} build ${BUILD} (test)" --notes-file notes.md
